name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    tags: ['v*', 'player-v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - 'LICENSE'
  # No paths-ignore: required checks must report on every PR, docs-only ones included.
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  pr-source:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only develop merges into main
        if: github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::PRs into main must come from develop"
          exit 1

  # code=false when a PR touches only the push trigger's paths-ignore files.
  changes:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
            gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' > files
            grep -qvE '\.md$|^docs/|^\.claude/|^LICENSE$' files || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Docs-only PRs: report the required build checks without building.
  build-docs-only:
    needs: changes
    if: needs.changes.outputs.code == 'false'
    name: build (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Docs-only change, nothing to build"

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: build (${{ matrix.os }})
    env:
      SCCACHE_GHA_ENABLED: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            build-target: uZXTests
            test-bin: build/src/uZXTests_artefacts/Debug/uZXTests
            cache-path: ~/Library/Caches/ccache
            parallel: 3
            configure-extra: ""
          - os: ubuntu-24.04
            build-target: uZXTests
            test-bin: build/src/uZXTests_artefacts/Debug/uZXTests
            cache-path: ~/.cache/ccache
            # Linux runners have 16 GB RAM; JUCE/Tracktion TUs are memory-heavy.
            # Unbounded -j OOM-kills the runner (SIGTERM/143), so cap parallelism.
            parallel: 3
            install-deps: true
            configure-extra: ""
          - os: windows-2022
            build-target: uZXTests
            test-bin: .\build\src\uZXTests_artefacts\Debug\uZXTests.exe
            parallel: 3
            configure-extra: -G Ninja
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout submodules (shallow)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth=1 --recursive

      - name: Install Linux dependencies
        if: matrix.install-deps
        uses: ./.github/actions/install-linux-deps

      - name: Install ccache (macOS)
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Install ccache (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ccache

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache (Windows)
        if: runner.os == 'Windows'
        uses: mozilla-actions/sccache-action@v0.0.11
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Restore build cache
        if: runner.os != 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.cache-path }}
          key: build-cache-${{ matrix.os }}-debug-${{ hashFiles('versions.cmake', 'src/sources.cmake') }}-${{ github.sha }}
          restore-keys: |
            build-cache-${{ matrix.os }}-debug-${{ hashFiles('versions.cmake', 'src/sources.cmake') }}-
            build-cache-${{ matrix.os }}-debug-

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          ${{ matrix.configure-extra }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER_LAUNCHER="${{ env.SCCACHE_PATH }}"
          -DCMAKE_CXX_COMPILER_LAUNCHER="${{ env.SCCACHE_PATH }}"
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
          ${{ matrix.configure-extra }}

      - name: Build tests
        run: cmake --build build --config Debug --parallel ${{ matrix.parallel || '' }} --target ${{ matrix.build-target }}

      - name: Run tests
        run: ${{ matrix.test-bin }}

  # ---------- Release pipeline ----------

  create-release:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') }}

  # Each app ships from its own tags: v* releases Studio, player-v* releases Player.
  release-macos:
    runs-on: macos-15
    needs: create-release
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      APP_TARGET: ${{ startsWith(github.ref_name, 'player-') && 'uZXPlayer' || 'uZX' }}
      # Ad-hoc signs the whole bundle after the build (src/CMakeLists.txt), so a downloaded
      # app gets Open Anyway in Privacy & Security instead of "is damaged"
      CODESIGN_IDENTITY: "-"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout submodules (shallow)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth=1 --recursive

      - name: Install ccache
        run: brew install ccache

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/ccache
          key: build-cache-macos-15-${{ hashFiles('versions.cmake', 'src/sources.cmake') }}-${{ github.sha }}
          restore-keys: |
            build-cache-macos-15-${{ hashFiles('versions.cmake', 'src/sources.cmake') }}-
            build-cache-macos-15-

      # player-v1.0.1-alpha -> VERSION=1.0.1-alpha, RELEASE_CHANNEL=alpha; v0.7.0 -> stable, empty channel.
      - name: Version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#player-}"
          VERSION="${VERSION#v}"
          CHANNEL=""
          if [[ "$VERSION" == *-* ]]; then CHANNEL="${VERSION#*-}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPROJECT_CHANNEL=${{ env.RELEASE_CHANNEL }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3 --target ${{ env.APP_TARGET }} --target uZXTests

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Run tests
        run: build/src/uZXTests_artefacts/Release/uZXTests

      - name: Package and Upload to GitHub Release
        run: |
          DMG="${APP_TARGET}-${VERSION}-macOS.dmg"
          STAGE="${RUNNER_TEMP}/dmg"
          mkdir "$STAGE"
          cp -R "build/src/${APP_TARGET}_artefacts/Release/"*.app "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          APP=$(basename "$STAGE"/*.app)
          codesign --verify --deep --strict "$STAGE/$APP"

          # hdiutil create sometimes fails with "Resource busy" on hosted runners
          for i in 1 2 3; do
            hdiutil create -volname "${APP%.app}" -srcfolder "$STAGE" -format UDZO -ov "$DMG" && break
            [ "$i" = 3 ] && exit 1
            sleep 5
          done
          gh release upload "${TAG_NAME}" "${DMG}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  release-linux:
    runs-on: ubuntu-24.04
    needs: create-release
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      APP_TARGET: ${{ startsWith(github.ref_name, 'player-') && 'uZXPlayer' || 'uZX' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout submodules (shallow)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth=1 --recursive

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps

      - name: Install ccache
        run: sudo apt-get install -y ccache

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ccache
          key: build-cache-ubuntu-24.04-${{ hashFiles('versions.cmake', 'src/sources.cmake') }}-${{ github.sha }}
          restore-keys: |
            build-cache-ubuntu-24.04-${{ hashFiles('versions.cmake', 'src/sources.cmake') }}-
            build-cache-ubuntu-24.04-

      # player-v1.0.1-alpha -> VERSION=1.0.1-alpha, RELEASE_CHANNEL=alpha; v0.7.0 -> stable, empty channel.
      - name: Version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#player-}"
          VERSION="${VERSION#v}"
          CHANNEL=""
          if [[ "$VERSION" == *-* ]]; then CHANNEL="${VERSION#*-}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DPROJECT_CHANNEL=${{ env.RELEASE_CHANNEL }}
          -DCMAKE_C_COMPILER_LAUNCHER=ccache
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel 3 --target ${{ env.APP_TARGET }} --target uZXTests

      - name: Show ccache stats
        run: ccache --show-stats

      - name: Run tests
        run: build/src/uZXTests_artefacts/Release/uZXTests

      - name: Package and Upload to GitHub Release
        run: |
          TARBALL="${APP_TARGET}-${VERSION}-linux-x86_64.tar.gz"
          if [ "$APP_TARGET" = uZXPlayer ]; then BIN="μZX Player"; else BIN="μZX Studio"; fi

          tar -czf "${TARBALL}" -C "build/src/${APP_TARGET}_artefacts/Release" "${BIN}"
          gh release upload "${TAG_NAME}" "${TARBALL}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  release-windows:
    runs-on: windows-2022
    needs: create-release
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      SCCACHE_GHA_ENABLED: "true"
      APP_TARGET: ${{ startsWith(github.ref_name, 'player-') && 'uZXPlayer' || 'uZX' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Checkout submodules (shallow)
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --depth=1 --recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      # player-v1.0.1-alpha -> VERSION=1.0.1-alpha, RELEASE_CHANNEL=alpha; v0.7.0 -> stable, empty channel.
      - name: Version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#player-}"
          VERSION="${VERSION#v}"
          CHANNEL=""
          if [[ "$VERSION" == *-* ]]; then CHANNEL="${VERSION#*-}"; fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPROJECT_CHANNEL=${{ env.RELEASE_CHANNEL }}
          -DCMAKE_C_COMPILER_LAUNCHER="${{ env.SCCACHE_PATH }}"
          -DCMAKE_CXX_COMPILER_LAUNCHER="${{ env.SCCACHE_PATH }}"

      - name: Build
        run: cmake --build build --parallel 3 --target ${{ env.APP_TARGET }} --target uZXTests

      - name: Run tests
        run: .\build\src\uZXTests_artefacts\Release\uZXTests.exe

      - name: Package and Upload to GitHub Release
        run: |
          $zip = "$env:APP_TARGET-$env:VERSION-windows-x64.zip"

          Compress-Archive -Path "build\src\$($env:APP_TARGET)_artefacts\Release\*.exe" -DestinationPath $zip
          gh release upload "$env:TAG_NAME" $zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  publish-release:
    runs-on: ubuntu-latest
    needs: [release-macos, release-linux, release-windows]
    if: github.ref_type == 'tag'
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate checksums
        run: |
          gh release download "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --dir artifacts
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "${TAG_NAME}" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

      - name: Publish release
        run: gh release edit "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
