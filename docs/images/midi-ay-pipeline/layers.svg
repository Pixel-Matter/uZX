<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img">
<title>MIDI to AY pipeline by layer</title>
<desc>Four stages left to right: chip instrument, chip effects, chip mixer, AY chip. Three layers top to bottom: transport as MIDI wires between the stages, bookkeeping as each stage's decoder and encoder, and logic that works on frames only. A strip below shows the note domain reaching into the mixer and the PSG domain from the mixer on.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; dominant-baseline: central; }
rect { stroke-width: 0.75; }
.bg { fill: #ffffff; stroke: none; }
.band { fill: #f7f6f2; stroke: #d3d1c7; }
.t { font-size: 13px; font-weight: 600; fill: #2c2c2a; }
.s { font-size: 12px; fill: #5f5e5a; }
.m { text-anchor: middle; }
.e { text-anchor: end; }
.arr, .head { stroke: #5f5e5a; stroke-width: 1.5; fill: none; }
.todo { stroke-dasharray: 4 3; }
.key { fill: none; stroke: #5f5e5a; }
.gray rect { fill: #f1efe8; stroke: #5f5e5a; }
.gray .t { fill: #444441; }
.purple rect { fill: #eeedfe; stroke: #534ab7; }
.purple .s { fill: #3c3489; }
.teal rect { fill: #e1f5ee; stroke: #0f6e56; }
.teal .t { fill: #085041; }
.teal .s { fill: #0f6e56; }
@media (prefers-color-scheme: dark) {
    .bg { fill: #1f1f1e; }
    .band { fill: #2c2c2a; stroke: #444441; }
    .t { fill: #f1efe8; }
    .s { fill: #b4b2a9; }
    .arr, .head, .key { stroke: #b4b2a9; }
    .gray rect { fill: #444441; stroke: #b4b2a9; }
    .gray .t { fill: #f1efe8; }
    .gray .s { fill: #d3d1c7; }
    .purple rect { fill: #3c3489; stroke: #afa9ec; }
    .purple .s { fill: #cecbf6; }
    .teal rect { fill: #085041; stroke: #5dcaa5; }
    .teal .t { fill: #9fe1cb; }
    .teal .s { fill: #5dcaa5; }
}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="head" d="M2 1L8 5L2 9" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect class="bg" width="680" height="420"/>

<text class="t m" x="195" y="30">Chip instrument</text>
<text class="t m" x="325" y="30">Chip effects</text>
<text class="t m" x="455" y="30">Chip mixer</text>
<text class="t m" x="585" y="30">AY chip</text>

<rect class="band" x="30" y="50" width="620" height="76" rx="8"/>
<rect class="band" x="30" y="142" width="620" height="84" rx="8"/>
<rect class="band" x="30" y="242" width="620" height="84" rx="8"/>
<text class="t" x="42" y="80">Transport</text>
<text class="s" x="42" y="98">MIDI</text>
<text class="t" x="42" y="175">Bookkeeping</text>
<text class="s" x="42" y="193">MIDI state</text>
<text class="t" x="42" y="275">Logic</text>
<text class="s" x="42" y="293">frame → frame</text>
<text class="t" x="42" y="356">Values</text>

<g class="gray"><rect x="118" y="64" width="78" height="48" rx="8"/><text class="t m" x="157" y="80">Notes</text><text class="s m" x="157" y="98">as played</text></g>
<g class="gray"><rect x="210" y="64" width="100" height="48" rx="8"/><text class="t m" x="260" y="80">Note wire</text><text class="s m" x="260" y="98">MPE notes</text></g>
<g class="gray"><rect x="340" y="64" width="100" height="48" rx="8"/><text class="t m" x="390" y="80">Note wire</text><text class="s m" x="390" y="98">MPE notes</text></g>
<g class="gray"><rect x="470" y="64" width="100" height="48" rx="8"/><text class="t m" x="520" y="80">PSG wire</text><text class="s m" x="520" y="98">register CCs</text></g>

<line class="arr" x1="160" y1="114" x2="160" y2="152" marker-end="url(#arrow)"/>
<line class="arr" x1="290" y1="114" x2="290" y2="152" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="114" x2="420" y2="152" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="114" x2="550" y2="152" marker-end="url(#arrow)"/>
<line class="arr" x1="230" y1="154" x2="230" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="154" x2="360" y2="116" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="154" x2="490" y2="116" marker-end="url(#arrow)"/>

<g class="purple"><rect x="140" y="156" width="110" height="56" rx="8"/><text class="s" x="150" y="174">MPEInstrument</text><text class="s e" x="240" y="194">NoteEncoder</text></g>
<g class="purple"><rect class="todo" x="270" y="156" width="110" height="56" rx="8"/><text class="s" x="280" y="174">NoteDecoder</text><text class="s e" x="370" y="194">NoteEncoder</text></g>
<g class="purple"><rect x="400" y="156" width="110" height="56" rx="8"/><text class="s" x="410" y="174">NoteDecoder</text><text class="s e" x="500" y="194">PsgEncoder</text></g>
<g class="purple"><rect x="530" y="156" width="110" height="56" rx="8"/><text class="s" x="540" y="174">PsgDecoder</text><text class="s e" x="630" y="194">chip registers</text></g>

<line class="arr" x1="160" y1="214" x2="160" y2="252" marker-end="url(#arrow)"/>
<line class="arr" x1="290" y1="214" x2="290" y2="252" marker-end="url(#arrow)"/>
<line class="arr" x1="420" y1="214" x2="420" y2="252" marker-end="url(#arrow)"/>
<line class="arr" x1="550" y1="214" x2="550" y2="252" marker-end="url(#arrow)"/>
<line class="arr" x1="230" y1="254" x2="230" y2="216" marker-end="url(#arrow)"/>
<line class="arr" x1="360" y1="254" x2="360" y2="216" marker-end="url(#arrow)"/>
<line class="arr" x1="490" y1="254" x2="490" y2="216" marker-end="url(#arrow)"/>

<g class="teal"><rect x="140" y="256" width="110" height="56" rx="8"/><text class="t m" x="195" y="274">Voices</text><text class="s m" x="195" y="292">ADSR, quantize</text></g>
<g class="teal"><rect class="todo" x="270" y="256" width="110" height="56" rx="8"/><text class="t m" x="325" y="274">Effects</text><text class="s m" x="325" y="292">vibrato, echo</text></g>
<g class="teal"><rect x="400" y="256" width="110" height="56" rx="8"/><text class="t m" x="455" y="274">ChipMixer</text><text class="s m" x="455" y="292">allocate, tune</text></g>
<g class="teal"><rect x="530" y="256" width="110" height="56" rx="8"/><text class="t m" x="585" y="274">AY emulation</text><text class="s m" x="585" y="292">makes audio</text></g>

<g class="gray"><rect x="140" y="342" width="313" height="28" rx="4"/><text class="s m" x="296" y="356">Note domain: NoteFrame, voices per frame</text></g>
<g class="gray"><rect x="457" y="342" width="183" height="28" rx="4"/><text class="s m" x="548" y="356">PSG domain: registers</text></g>

<rect class="key todo" x="140" y="386" width="16" height="12" rx="2"/>
<text class="s" x="164" y="392">Dashed: not built yet</text>
</svg>
